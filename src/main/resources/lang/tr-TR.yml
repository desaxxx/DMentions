# (!) Kullanılabilir mesaj türleri: CHAT, ACTION_BAR, TITLE.
#     Kullanım: "KANAL_TÜRÜ=Herhangi bir mesaj"
#     Kanal belirtilmezse mesaj sohbete (CHAT) gönderilir.
#     Örnekler:
#       - "ACTION_BAR=<red>Bu hoş değil."
#       - "TITLE=<#4bbdbc>Etiket||<white>Bir oyuncu tarafından etiketlendin."
#       - "CHAT=<prefix> <gray>Bu mesaj config.yml'den düzenlediğin önekli bir mesaj."
#       TITLE durumunda mesaj içinde || kullanarak başlık ve alt başlığı ayırabilirsin.
# (!) Mesajlar MiniMessage formatındadır: https://docs.papermc.io/adventure/minimessage/format
# (!) Bir mesajı kapatmak için listeyi boş bırak: sender_message: []
#
cooldown_warn:
  - "ACTION_BAR=<red>Tekrar etiketlemek için <remaining> beklemelisin."

update_available:
  - "CHAT=<prefix> <yellow>Yeni bir sürüm çıktı: <white><latest> <gray>(şu anki: <current>) <click:open_url:'https://modrinth.com/plugin/dmentions'><#ffd16d><u>İndir</u></click>"

disabled_world_warn:
  - "ACTION_BAR=<prefix> <red>Bu dünyada oyuncu etiketleyemezsin."

player:
  sender_message:
    - "ACTION_BAR=<prefix> <#ddf7a6><target><#f4e4c0> adlı oyuncudan bahsettin."
  target_message:
    - "ACTION_BAR=<prefix> <#ddf7a6><sender><#f4e4c0> adlı oyuncu sohbette senden bahsetti."
    - "TITLE=<prefix>||<#f4e4c0>Sohbette biri senden bahsetti."

everyone:
  sender_message:
    - "ACTION_BAR=<prefix> <#f4e4c0>Herkesten bahsettin."
  target_message:
    - "ACTION_BAR=<prefix> <#ddf7a6><sender><#f4e4c0> adlı oyuncu herkesten bahsetti."
    - "TITLE=<prefix>||<#f4e4c0>Sohbette biri senden bahsetti."

nearby:
  sender_message:
    - "ACTION_BAR=<prefix> <#f4e4c0>Yakındaki oyunculardan bahsettin."
  target_message:
    - "ACTION_BAR=<prefix> <#ddf7a6><sender><#f4e4c0> adlı oyuncu yakındaki oyunculardan bahsetti."
    - "TITLE=<prefix>||<#f4e4c0>Sohbette biri senden bahsetti."

group:
  sender_message:
    - "ACTION_BAR=<prefix> <#ddf7a6><group><#f4e4c0> üyelerinden bahsettin."
  target_message:
    - "ACTION_BAR=<prefix> <#ddf7a6><sender><#f4e4c0> adlı oyuncu <#ddf7a6><group><#f4e4c0> üyelerinden bahsetti."
    - "TITLE=<prefix>||<#f4e4c0>Sohbette biri senden bahsetti."

command:
  help:
    header:
      - "CHAT=<prefix> <gray>Komutlar:"
    toggle:
      - "CHAT=<#ffd16d>/dms toggle <gray>- Etiketlenmeyi açar veya kapatır"
    send:
      - "CHAT=<#ffd16d>/dms send <keyword> <gray>- Etiket gönderir"
    config:
      - "CHAT=<#ffd16d>/dms config <gray>- Ayar menüsünü açar"
    reload:
      - "CHAT=<#ffd16d>/dms reload <gray>- Config ve dil dosyalarını yeniden yükler"
    customize:
      - "CHAT=<#ffd16d>/dms customize <name> <gray>- Etiketlendiğinde görünen ismini değiştirir"
    user:
      - "CHAT=<#ffd16d>/dms user <player> mentionable <true|false> <gray>- Bir oyuncunun etiketlenip etiketlenemeyeceğini ayarlar"
      - "CHAT=<#ffd16d>/dms user <player> custom_name <name> <gray>- Bir oyuncunun etiketlendiğinde görünen ismini ayarlar"
    version:
      - "CHAT=<#ffd16d>/dms version <gray>- Eklenti sürümünü gösterir"
  must_be_player:
    - "CHAT=<prefix> <red>Bu komutu kullanmak için oyuncu olmalısın."
  player_not_found:
    - "CHAT=<prefix> <red>Oyuncu bulunamadı: <white><player>"
  version:
    - "CHAT=<prefix> <gray>DMentions <white><version><gray> sürümü çalışıyor"
  toggle:
    enabled:
      - "CHAT=<prefix> <green>Artık etiketlenebilirsin."
    disabled:
      - "CHAT=<prefix> <yellow>Artık etiketlenmeyeceksin."
  customize:
    invalid_custom_name:
      - "CHAT=<prefix> <red>Geçersiz isim: <white><value><red>. 3-16 harf, rakam veya _ kullan."
    success:
      - "CHAT=<prefix> <green>Etiket ismini <white><old_value><green> yerine <white><value><green> olarak değiştirdin."
  user:
    mentionable:
      enabled:
        - "CHAT=<prefix> <white><target> <green>artık etiketlenebilir."
      disabled:
        - "CHAT=<prefix> <white><target> <yellow>artık etiketlenemez."
    custom_name:
      success:
        - "CHAT=<prefix> <white><target><green> adlı oyuncunun etiket ismi <white><old_value><green> yerine <white><value><green> olarak değiştirildi."
  send:
    invalid_keyword:
      - "CHAT=<prefix> <red>Geçersiz anahtar kelime: <white><keyword>"
  reload:
    success:
      - "CHAT=<prefix> <green>Config ve dil dosyaları yeniden yüklendi."
    failed:
      - "CHAT=<prefix> <red>Yeniden yükleme başarısız oldu. Ayrıntılar için konsola bak."
